<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="{{url_for('static',filename='register.css')}}">
</head>
<body>
    <div class="sign_up">
        <div class="close-sign"></div>
            <h1><img  class="img" src="https://openclipart.org/image/800px/313833"> QuikSend</h1>
            <h2>Sign_Up</h2>
            {% if error %}
            <p>{{ error }}</p>  <!-- Display error message if it exists -->
            {% endif %}
        <form action="/register" method="POST">
            <div class="form-group">
                <label for="email">Email</label>
                <input name="email" type="email" id="email" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
                
            </div>
            <br>
            <button class="button" type="submit">Sign Up</button> 
            <!-- <a class="lok" role="button" aria-disabled="true" href="/login">Login</a> -->
            <p class="back">
                Back to <span class="log"><a href="/login">login</a></span>
            </p>
        </form>
    </div>
</body>
</html>
