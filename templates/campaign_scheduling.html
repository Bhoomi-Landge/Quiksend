    <div class="container">
        <form class="new" action="/campaign_scheduling/{{ campaign.id }}" method="POST">
            <h1 class="campaign">Campaign Scheduling:</h1>
            <div class="section">
                <label for="recipients">To (Recipients)</label>
                <div id="recipient-list">
                    <select class="dropdown" name="recipient_email[]" id="recipient_email" >
                        <option value=""></option>
                        {% for recipient_email in recipients %}
                        <option value="{{ recipient_email }}">{{ recipient_email }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <!-- <script>
                document.addEventListener("DOMContentLoaded", function () {
                    var recipientSelect = document.getElementById("recipient_email");
                    var buttonGroup = document.getElementById("button-group");
                    recipientSelect.addEventListener("change", function () {
                        var selectedOptions = recipientSelect.selectedOptions;
                        if (selectedOptions.length > 1) {
                            buttonGroup.style.display = "block";
                        } else {
                            buttonGroup.style.display = "none";
                        }
                    });
                });
            </script> -->
            <div class="section">
                <label for="from">From (Sender)</label>
                <input type="text" id="from" value="{{ email }}" name="sender_email" >
            </div>
            <div class="section">
                <label for="campaign_name">Campaign Name:</label>
                <input type="text" id="campaign_name" name="campaign_name" value="{{ campaign_name }}" readonly>
            </div>
            <div class="section">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" value="{{ subject }}" readonly>
            </div>
            
            <div class="buttons">
                <button class="action" name="action" value="schedule">Schedule</button>
                <button class="action" name="action" value="send_now">Send Now</button>
                <br>{% if status %}
            <p>{{ status }}</p>
            {% endif %}
            </div>
        </form>
    </div>
