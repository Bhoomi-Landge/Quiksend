        <script>
            // JavaScript to handle form submission
            document.getElementById('scheduling-form').addEventListener('submit', function(event) {
                event.preventDefault(); // Prevent default form submission
                
                // Get the selected delivery date and time
                var deliveryDate = document.getElementById('delivery-date').value;
                var deliveryTime = document.getElementById('delivery-time').value;
                
                // Construct the datetime string
                var scheduledDateTime = deliveryDate + ' ' + deliveryTime;
                
                // Send an AJAX request to the server to schedule the email
                var xhr = new XMLHttpRequest();
                xhr.open('POST', '/campaign_scheduling/{{ campaign.id }}'); // Assuming '/campaign_scheduling/<campaign_id>' is the route to schedule the email
                xhr.setRequestHeader('Content-Type', 'application/json');
                xhr.onload = function() {
                    if (xhr.status === 200) {
                        alert('Email scheduled successfully!');
                    } else {
                        alert('Failed to schedule email. Please try again.');
                    }
                };
                xhr.send(JSON.stringify({ scheduledDateTime: scheduledDateTime }));
            });
        </script>
        
        <form id="scheduling-form" action="/campaign_scheduling/{{ campaign.id }}" method="post">
            <!-- Your form fields for scheduling -->
            <input id="delivery-date" type="date" name="scheduled_date">
            <input id="delivery-time" type="time" name="scheduled_time">
            <!-- Add other fields as needed -->
            <button type="submit">Schedule Email</button>
        </form>
